<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Casa Sandbox</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui">
        <div id="sidebar" class="sidebar">
          <header class="hud">
            <div class="hud-top">
              <div class="hud-title">
                <h1>Casa Sandbox</h1>
                <p class="save-status" id="save-status"></p>
              </div>
              <div class="toolbar" id="toolbar"></div>
            </div>
            <div class="view-tools" id="view-tools"></div>
            <p class="hint">Clique num móvel para editar, ou no piso para trocar piso e pintura. Arraste para girar a câmera · roda/pinça: zoom · botão direito/dois dedos: mover</p>
          </header>
        </div>
        <div id="loading" class="loading">Carregando…</div>
        <div class="fp-overlay" aria-hidden="true">
          <div class="crosshair"></div>
          <p>WASD ou setas para andar · mouse para olhar · Shift corre · Esc sai</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
